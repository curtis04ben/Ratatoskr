# Builds the signed Android APK and publishes it as its own GitHub Release,
# separate from the server and Linux client releases.
#
#   git tag android-v0.1.0 && git push origin android-v0.1.0
#     -> tests, builds + signs the APK, creates release "Ratatoskr Android v0.1.0"
#
# Signing needs four repository secrets (Settings -> Secrets and variables
# -> Actions) -- see clients/README.md for how to create the keystore:
#   RATATOSKR_KEYSTORE_BASE64   base64 of the .jks file
#   RATATOSKR_KEYSTORE_PASSWORD
#   RATATOSKR_KEY_ALIAS
#   RATATOSKR_KEY_PASSWORD
#
# Running it manually (Actions tab -> Run workflow) builds the APK as a
# workflow artifact without releasing anything.
name: Android client release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    # Job-wide, not per step: once RATATOSKR_KEYSTORE_FILE is set, Gradle
    # needs the rest of these to configure the build at all.
    env:
      RATATOSKR_KEYSTORE_PASSWORD: ${{ secrets.RATATOSKR_KEYSTORE_PASSWORD }}
      RATATOSKR_KEY_ALIAS: ${{ secrets.RATATOSKR_KEY_ALIAS }}
      RATATOSKR_KEY_PASSWORD: ${{ secrets.RATATOSKR_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^ratatoskrAndroidVersion=//p' gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ratatoskrAndroidVersion=$version in clients/gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RATATOSKR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::RATATOSKR_KEYSTORE_BASE64 secret isn't set -- refusing to release an unsigned APK"
              exit 1
            fi
            echo "::warning::No signing secrets; building an unsigned APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RATATOSKR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew --no-daemon :shared:jvmTest

      - name: Build APK
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          apk="$(ls android/build/outputs/apk/release/*.apk | head -1)"
          cp "$apk" "$RUNNER_TEMP/out/Ratatoskr-${VERSION}.apk"
          cd "$RUNNER_TEMP/out"
          sha256sum "Ratatoskr-${VERSION}.apk" > SHA256SUMS
          if [ -n "${RATATOSKR_KEYSTORE_FILE:-}" ]; then
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
            "$apksigner" verify --print-certs "Ratatoskr-${VERSION}.apk" | tee "$RUNNER_TEMP/certs.txt"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ratatoskr-android-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Ratatoskr for Android (8.0 and newer). Connects to your own Ratatoskr server -- the server itself isn't part of this release; see server/README.md.

          ## Install

          1. On your phone, download \`Ratatoskr-${VERSION}.apk\` below.
          2. Open it. Android will ask you to allow installs from your browser or file manager ("Install unknown apps") -- allow it for that app.
          3. Tap **Install**. Ratatoskr appears in your app drawer.

          Updating: install a newer APK the same way; your saved server carries over.

          Verify the download with \`sha256sum -c SHA256SUMS\`. Signing certificate SHA-256: \`${cert}\` -- every release is signed with this same key, and Android refuses an update signed by any other.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ratatoskr Android v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/out/"*
