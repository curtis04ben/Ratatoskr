kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
org.jetbrains.compose.experimental.jscanvas.enabled=false

# Desktop client version -- the single source of truth. Bump this, commit,
# then push a matching tag (linux-v<version>) to build a GitHub Release.
ratatoskrDesktopVersion=0.1.1

# Android app version -- independent of the desktop one. Release with a
# matching android-v<version> tag.
ratatoskrAndroidVersion=0.1.0
android.useAndroidX=true
